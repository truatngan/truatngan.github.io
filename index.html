<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตรวจงาน</title>
<meta name="theme-color" content="#2F6BFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ตรวจงาน">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#2F6BFF}
  iframe{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;display:block;background:#fff}
  /* หน้าโหลด: แบรนด์เด้งเข้า + เครื่องหมายถูกวาดเอง + แถบโหลดวิ่ง */
  .splash{position:fixed;inset:0;z-index:10;background:#2F6BFF;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;font-family:Prompt,system-ui,sans-serif;color:#fff;transition:opacity .45s ease,transform .45s cubic-bezier(.4,0,.2,1)}
  .splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
  .blob{position:absolute;width:62vmin;height:62vmin;max-width:420px;max-height:420px;border-radius:50%;background:#C8F03C;right:-18vmin;top:-18vmin;animation:blobIn .9s cubic-bezier(.2,.9,.2,1.15) both,blobFloat 6s ease-in-out .9s infinite}
  .sq{position:absolute;width:30vmin;height:30vmin;max-width:190px;max-height:190px;border-radius:26%;border:3px solid rgba(255,255,255,.35);left:-8vmin;bottom:12vh;animation:sqIn 1s cubic-bezier(.2,.9,.2,1) .15s both,sqSpin 14s linear 1.1s infinite}
  .dot{position:absolute;width:14px;height:14px;border-radius:50%;background:#C8F03C;left:22%;top:24%;animation:pop .5s cubic-bezier(.2,.9,.2,1.4) .5s both,bob 3s ease-in-out 1s infinite}
  .name{font-size:34px;font-weight:700;letter-spacing:.3px;animation:rise .6s cubic-bezier(.2,.9,.2,1) .35s both}
  .tag{margin-top:-14px;font-size:15px;font-weight:600;color:rgba(255,255,255,.82);animation:rise .6s cubic-bezier(.2,.9,.2,1) .5s both}
  .bar{position:absolute;bottom:calc(14vh + env(safe-area-inset-bottom));width:132px;height:6px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden;animation:rise .5s ease .7s both}
  .bar i{position:absolute;top:0;bottom:0;width:44%;border-radius:3px;background:#C8F03C;animation:run 1.15s cubic-bezier(.6,0,.4,1) infinite}
  .slow{position:absolute;bottom:calc(14vh - 34px + env(safe-area-inset-bottom));font-size:13px;font-weight:600;color:rgba(255,255,255,.75);opacity:0;transition:opacity .4s}
  .slow.on{opacity:1}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}}
  @keyframes run{from{left:-44%}to{left:100%}}
  @keyframes blobIn{from{transform:scale(.2);opacity:0}}
  @keyframes blobFloat{50%{transform:translate(-10px,14px) scale(1.04)}}
  @keyframes sqIn{from{opacity:0;transform:translateY(40px) rotate(-30deg)}}
  @keyframes sqSpin{to{transform:rotate(360deg)}}
  @keyframes pop{from{transform:scale(0)}}
  @keyframes bob{50%{transform:translateY(-10px)}}
  .stage{width:min(78vw,340px);height:250px;margin-bottom:6px;--tw-w:125px;animation:rise .6s cubic-bezier(.2,.9,.2,1) .1s both}
  .tw{position:relative}
  .tw-move{position:absolute;bottom:0;animation:twMove 5.2s ease-in-out infinite}
  .tw-flip{animation:twFlip 5.2s steps(1) infinite}
  .tw-svg{display:block;width:100%;height:100%;overflow:visible}
  .tw-svg g{transform-box:view-box}
  .tw-legF,.tw-legB{transform-origin:70px 164px}
  .tw-armF,.tw-armB{transform-origin:70px 97px}
  .tw-head{transform-origin:70px 76px}
  .tw-legF{animation:twLegF 5.2s linear infinite}.tw-legB{animation:twLegB 5.2s linear infinite}
  .tw-armB{animation:twArmB 5.2s linear infinite}.tw-armF{animation:twArmF 5.2s linear infinite}
  .tw-body{animation:twBob 5.2s linear infinite}
  .tw-chk{stroke-dasharray:24;animation:twChk 5.2s linear infinite}
  @keyframes twMove{0%{left:0}44%,56%{left:calc(100% - var(--tw-w))}100%{left:0}}
  @keyframes twFlip{0%{transform:none}56%{transform:scaleX(-1)}}
  @keyframes twLegF{0%{transform:rotate(0)}7.33%{transform:rotate(17deg)}14.67%{transform:rotate(-17deg)}22.00%{transform:rotate(17deg)}29.33%{transform:rotate(-17deg)}36.67%{transform:rotate(17deg)}44.00%{transform:rotate(0deg)}56%{transform:rotate(0)}63.33%{transform:rotate(17deg)}70.67%{transform:rotate(-17deg)}78.00%{transform:rotate(17deg)}85.33%{transform:rotate(-17deg)}92.67%{transform:rotate(17deg)}100.00%{transform:rotate(0deg)}}
  @keyframes twLegB{0%{transform:rotate(0)}7.33%{transform:rotate(-17deg)}14.67%{transform:rotate(17deg)}22.00%{transform:rotate(-17deg)}29.33%{transform:rotate(17deg)}36.67%{transform:rotate(-17deg)}44.00%{transform:rotate(0deg)}56%{transform:rotate(0)}63.33%{transform:rotate(-17deg)}70.67%{transform:rotate(17deg)}78.00%{transform:rotate(-17deg)}85.33%{transform:rotate(17deg)}92.67%{transform:rotate(-17deg)}100.00%{transform:rotate(0deg)}}
  @keyframes twArmB{0%{transform:rotate(0)}7.33%{transform:rotate(14deg)}14.67%{transform:rotate(-14deg)}22.00%{transform:rotate(14deg)}29.33%{transform:rotate(-14deg)}36.67%{transform:rotate(14deg)}44.00%{transform:rotate(0deg)}56%{transform:rotate(0)}63.33%{transform:rotate(14deg)}70.67%{transform:rotate(-14deg)}78.00%{transform:rotate(14deg)}85.33%{transform:rotate(-14deg)}92.67%{transform:rotate(14deg)}100.00%{transform:rotate(0deg)}}
  @keyframes twArmF{0%,44%{transform:rotate(0)}47%,53%{transform:rotate(-62deg)}56%,100%{transform:rotate(0)}}
  @keyframes twChk{0%,47.5%{stroke-dashoffset:24}51%,96%{stroke-dashoffset:0}100%{stroke-dashoffset:24}}
  @keyframes twBob{0%{transform:translateY(0)}1.83%{transform:translateY(-3px)}3.67%{transform:translateY(0)}5.50%{transform:translateY(-3px)}7.33%{transform:translateY(0)}9.17%{transform:translateY(-3px)}11.00%{transform:translateY(0)}12.83%{transform:translateY(-3px)}14.67%{transform:translateY(0)}16.50%{transform:translateY(-3px)}18.33%{transform:translateY(0)}20.17%{transform:translateY(-3px)}22.00%{transform:translateY(0)}23.83%{transform:translateY(-3px)}25.67%{transform:translateY(0)}27.50%{transform:translateY(-3px)}29.33%{transform:translateY(0)}31.17%{transform:translateY(-3px)}33.00%{transform:translateY(0)}34.83%{transform:translateY(-3px)}36.67%{transform:translateY(0)}38.50%{transform:translateY(-3px)}40.33%{transform:translateY(0)}42.17%{transform:translateY(-3px)}44.00%{transform:translateY(0)}57.83%{transform:translateY(-3px)}59.67%{transform:translateY(0)}61.50%{transform:translateY(-3px)}63.33%{transform:translateY(0)}65.17%{transform:translateY(-3px)}67.00%{transform:translateY(0)}68.83%{transform:translateY(-3px)}70.67%{transform:translateY(0)}72.50%{transform:translateY(-3px)}74.33%{transform:translateY(0)}76.17%{transform:translateY(-3px)}78.00%{transform:translateY(0)}79.83%{transform:translateY(-3px)}81.67%{transform:translateY(0)}83.50%{transform:translateY(-3px)}85.33%{transform:translateY(0)}87.17%{transform:translateY(-3px)}89.00%{transform:translateY(0)}90.83%{transform:translateY(-3px)}92.67%{transform:translateY(0)}94.50%{transform:translateY(-3px)}96.33%{transform:translateY(0)}98.17%{transform:translateY(-3px)}100.00%{transform:translateY(0)}}
  @media (prefers-reduced-motion:reduce){.tw *{animation:none!important}.tw-chk{stroke-dashoffset:0}}
  @media (prefers-reduced-motion:reduce){.splash *,.splash *::after{animation:none!important}.splash{transition:opacity .2s}}
</style>
</head>
<body>
<div class="splash" id="splash" role="status" aria-label="กำลังเปิดแอปตรวจงาน">
  <div class="blob"></div><div class="sq"></div><div class="dot"></div>
  <div class="tw stage"><div class="tw-move" style="width:var(--tw-w);height:100%"><div class="tw-flip" style="width:100%;height:100%"><svg class="tw-svg" viewBox="0 0 140 280" fill="none" aria-hidden="true"><ellipse cx="70" cy="268" rx="26" ry="4.5" fill="rgba(16,19,26,.18)"/><g class="tw-body"><g class="tw-legB"><rect x="63.5" y="160" width="13" height="98" rx="6.5" fill="#2C3140"/><rect x="61" y="254" width="25" height="8" rx="4" fill="#10131A"/></g><g class="tw-armB"><rect x="64.5" y="92" width="11" height="70" rx="5.5" fill="#2C3140"/><circle cx="70" cy="164" r="5.5" fill="#E8B793"/></g><g class="tw-legF"><rect x="63.5" y="160" width="13" height="98" rx="6.5" fill="#1B1F2A"/><rect x="61" y="254" width="26" height="8" rx="4" fill="#10131A"/></g><path d="M50 90 Q70 83 90 90 L93 170 Q70 176 47 170 Z" fill="#10131A"/><path d="M63 87 L70 108 L77 87 Z" fill="#fff"/><rect x="68.6" y="94" width="2.8" height="38" rx="1.4" fill="#C8F03C"/><rect x="65.5" y="72" width="9" height="16" rx="4" fill="#E8B793"/><g class="tw-head"><circle cx="70" cy="55" r="19" fill="#E8B793"/><path d="M51 54c0-14 8.5-22 20-22 11.5 0 19 7.5 19 18.5-4.5-5-11.5-7.8-20-7-7.8.9-14 4.9-19 10.5z" fill="#10131A"/><g stroke="#10131A" stroke-width="1.6"><rect x="66" y="56" width="8" height="5.5" rx="2.6"/><rect x="77" y="56" width="8" height="5.5" rx="2.6"/><path d="M74 58.2h3"/></g></g><g class="tw-armF"><rect x="64.5" y="92" width="11" height="68" rx="5.5" fill="#1B1F2A"/><rect x="68" y="128" width="30" height="40" rx="4" fill="#fff"/><rect x="73" y="135" width="16" height="3" rx="1.5" fill="#DCE1EC"/><rect x="73" y="141" width="11" height="3" rx="1.5" fill="#DCE1EC"/><path class="tw-chk" d="M74 155l4.5 4.5 10-10.5" stroke="#2F6BFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="71" cy="160" r="5.5" fill="#E8B793"/></g></g></svg></div></div></div>
  <div class="name">ตรวจงาน</div>
  <div class="tag">ส่งงาน · ดูคะแนน · จบในแอปเดียว</div>
  <div class="bar"><i></i></div>
  <div class="slow" id="slow">กำลังเชื่อมต่อ อีกสักครู่…</div>
</div>
<script>
  // ลิงก์แอป (Apps Script) — อัปเดตแอปภายหลังไม่ต้องแก้ไฟล์นี้ ตราบใดที่ใช้การทำให้ใช้งานได้รายการเดิม
  var APP = 'https://script.google.com/macros/s/AKfycbzGbc98YM6NdQiTpFpArcY35NSgtgOpQoKGchcwJQ83wYHeSxLJ5l3Ocbim5j11FAVE/exec';
  var t0 = Date.now(), sp = document.getElementById('splash');
  function hide() {
    // ให้อาจารย์เดินถึงจุดตรวจงานอย่างน้อยหนึ่งครั้ง (ราว 2.6 วิ) แล้วค่อยจางออก
    setTimeout(function () { sp.classList.add('out'); setTimeout(function () { sp.remove(); }, 500); }, Math.max(0, 2600 - (Date.now() - t0)) + 200);
  }
  var f = document.createElement('iframe');
  f.src = APP + location.search; // ส่งต่อ ?join=รหัสเข้าห้อง และ ?view=teacher
  f.title = 'ตรวจงาน';
  f.allow = 'microphone; camera; clipboard-write; fullscreen';
  f.onload = hide;
  document.body.appendChild(f);
  setTimeout(function () { var s = document.getElementById('slow'); if (s) s.classList.add('on'); }, 7000);
  setTimeout(function () { if (document.getElementById('splash')) hide(); }, 20000);
</script>
</body>
</html>
